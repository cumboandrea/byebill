name: byebill
description: "ByeBill subscription reminder app"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.3.10
  riverpod_annotation: ^2.1.5
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^5.1.0
  timezone: ^0.9.4
  go_router: ^14.6.2
  shared_preferences: ^2.3.5
  intl: ^0.20.3
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.10
  package_info_plus: ^8.1.0
  fl_chart: ^0.70.2
  permission_handler: ^11.3.1
  workmanager: ^0.7.0
  device_calendar: ^4.3.3
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.3.2
  build_runner: ^2.4.12
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logos/
